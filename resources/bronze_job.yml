resources:
  jobs:
    bronze_census_ingestion:
      name: "Bronze - Census, POI & LCE Locations"

      # PREREQUISITES - Manual Data Upload Required:
      # Upload raw locations table to: {catalog}.{bronze_schema}.lce_locations_raw
      # Required columns: location_id, store_name, latitude, longitude,
      #                   address, city, state, zip_code

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications (uncomment and set user_email variable to enable)
      # email_notifications:
      #   on_failure:
      #     - "${var.user_email}"

      # Job-level timeout (2 hours)
      timeout_seconds: 7200

      # Job-level tags
      tags:
        Environment: "dev"
        Layer: "bronze"
        Pipeline: "census_poi_ingestion"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"
              - "pygris"
              - "osmium"  # For OSM PBF parsing

      tasks:
        # Current stores ingestion with sales data
        - task_key: "ingest_current_stores"
          notebook_task:
            notebook_path: ../transformations/01_bronze/ingest_current_stores.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              lce_locations_table: "${var.lce_locations_raw_table}"

          environment_key: "Serverless"
          timeout_seconds: 600

        # Census ingestion (boundaries + demographics)
        - task_key: "ingest_census"
          notebook_task:
            notebook_path: ../transformations/01_bronze/ingest_census.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              state_fips: "${var.state_fips}"
              year: "${var.acs_year}"
              census_api_key: "${var.census_api_key}"
              config_path: "${workspace.file_path}/resources/configs/census_variables.yml"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # POI ingestion (Overpass API - queries OSM for partner/competitor brands)
        # Only queries expansion_state (MA) since branded POIs are for candidate mapping
        - task_key: "ingest_pois"
          notebook_task:
            notebook_path: ../transformations/01_bronze/ingest_pois.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"
              expansion_state: "${var.expansion_state}"

          environment_key: "Serverless"
          timeout_seconds: 300

      max_concurrent_runs: 1
