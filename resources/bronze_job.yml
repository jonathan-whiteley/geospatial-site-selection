resources:
  jobs:
    bronze_census_ingestion:
      name: "Bronze - Census, POI & LCE Locations"

      # PREREQUISITES - Manual Data Upload Required:
      # Upload raw LCE locations table to: {catalog}.{bronze_schema}.lce_locations_raw
      # Required columns: LocationKey, Y_Coordinate_Latitude, X_Coordinate_Longitude,
      #                   Address1, City, State, Zip, StoreStatus

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications (uncomment and set user_email variable to enable)
      # email_notifications:
      #   on_failure:
      #     - "${var.user_email}"

      # Job-level timeout (2 hours)
      timeout_seconds: 7200

      # Job-level tags
      tags:
        Environment: "${bundle.target}"
        Layer: "bronze"
        Pipeline: "census_poi_ingestion"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"
              - "pygris"
              - "osmium"

      tasks:
        # LCE store locations transformation
        - task_key: "lce_locations"
          notebook_task:
            notebook_path: ../transformations/01_bronze/lce_locations.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              lce_locations_table: "${var.lce_locations_raw_table}"
              state_filter: "${var.state_filter}"

          environment_key: "Serverless"
          timeout_seconds: 600

        # Consolidated census ingestion (boundaries + demographics)
        - task_key: "census_ingestion"
          notebook_task:
            notebook_path: ../transformations/01_bronze/census.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              state_fips: "${var.state_fips}"
              year: "${var.acs_year}"
              census_api_key: "${var.census_api_key}"
              config_path: "${workspace.file_path}/resources/configs/census_variables.yml"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Consolidated POI ingestion (OSM download + extraction)
        - task_key: "poi_ingestion"
          notebook_task:
            notebook_path: ../transformations/01_bronze/poi_ingestion.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              osm_url: "${var.osm_url}"
              osm_region: "${var.osm_region}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"

          environment_key: "Serverless"
          timeout_seconds: 7200

      max_concurrent_runs: 1
