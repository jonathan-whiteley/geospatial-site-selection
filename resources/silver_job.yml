resources:
  jobs:
    silver_poi_processing:
      name: "Silver - POI Cleaning"

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications
      email_notifications:
        on_failure:
          - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "${bundle.target}"
        Layer: "silver"
        Pipeline: "poi_processing_isochrones"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            dependencies:
              - "pyyaml"
              - "h3"
              - "shapely"
              - "requests"

      tasks:
        - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/clean_pois.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.schema}"
              silver_schema: "${var.schema}"
              state_filter: "${var.state_filter}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"

          environment_key: "Serverless"

          timeout_seconds: 3600
          max_retries: 2

        # OSRM Isochrone Generation (Public API - No Installation Required)
        - task_key: "create_rmc_isochrones_urbanicity"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_osrm_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              input_table: "bronze_rmc_retail_locations_grocery"
              output_table: "silver_rmc_isochrones"

          environment_key: "Serverless"

          timeout_seconds: 7200
          max_retries: 2

        # Seed Points Expansion Isochrones
        - task_key: "create_seed_points_isochrones"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_osrm_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              input_table: "bronze_seed_points_expansion"
              output_table: "seed_points_isochrones"

          environment_key: "Serverless"

          timeout_seconds: 7200
          max_retries: 2

      max_concurrent_runs: 1
