resources:
  jobs:
    silver_poi_processing:
      name: "Silver - Isochrones"

      # PREREQUISITES - Required tables in bronze schema:
      # These tables must exist before running this job:
      # - lce_locations_mass (Little Caesars stores - manually uploaded)
      #
      # Tables created by bronze_census_ingestion job:
      # - census_states (state boundaries)
      # - osm_pois_raw (optional - for custom POI analysis)
      #
      # External data sources:
      # - CARTO marketplace: carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3
      #   (Provides demographics + POI counts at H3-8 resolution)

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications
      email_notifications:
        on_failure:
          - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "${bundle.target}"
        Layer: "silver"
        Pipeline: "poi_processing_isochrones"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            dependencies:
              - "pyyaml"
              - "h3"
              - "shapely"
              - "requests"
              - "folium"

      tasks:
        - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/clean_pois.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              state_filter: "${var.state_filter}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"

          environment_key: "Serverless"

          timeout_seconds: 3600

        - task_key: "create_h3_features"
          # NO LONGER depends on clean_pois - uses CARTO POI data instead
          notebook_task:
            notebook_path: ../transformations/02_silver/create_h3_features.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              state_fips: "${var.state_fips}"
              config_path: "${workspace.file_path}/resources/configs/h3_features_config.yml"

          environment_key: "Serverless"

          timeout_seconds: 7200

        - task_key: "create_lce_isochrones_osrm"
          depends_on:
            - task_key: "create_h3_features"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_osrm_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              input_table: "lce_locations_mass"
              output_table: "lce_isochrones_5min"

          environment_key: "Serverless"

          timeout_seconds: 7200

      max_concurrent_runs: 1
