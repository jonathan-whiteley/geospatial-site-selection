resources:
  jobs:
    silver_poi_processing:
      name: "Silver - Feature Engineering"

      # PREREQUISITES - Required tables in bronze schema:
      # - current_stores_ne (stores - created by bronze_census_ingestion job)
      # - census_states (state boundaries - created by bronze_census_ingestion job)
      # - raw_pois (from bronze_census_ingestion job)
      #
      # External data sources:
      # - CARTO marketplace: carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications (uncomment and set user_email variable to enable)
      # email_notifications:
      #   on_failure:
      #     - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "dev"
        Layer: "silver"
        Pipeline: "feature_engineering"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"
              - "h3"
              - "shapely"
              - "requests"
              - "folium"

      tasks:
        # Clean POIs and split into convenience/competitors
        - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/clean_pois.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              state_filter: "${var.state_filter}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Clean H3 features with derived columns (includes CARTO ingestion)
        - task_key: "clean_h3_features"
          notebook_task:
            notebook_path: ../transformations/02_silver/clean_h3_features.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              carto_table: "${var.carto_table}"
              state_filter: "${var.state_filter}"

          environment_key: "Serverless"
          timeout_seconds: 1800
          depends_on:
            - task_key: "clean_pois" # Needs census_states table from bronze

        # Generate LCE store isochrones (Valhalla)
        - task_key: "create_isochrones_lce"
          depends_on:
            - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              current_stores_table: "${var.current_stores_table}"
              input_source: "lce"
              valhalla_url: "https://valhalla1.openstreetmap.de"

          environment_key: "Serverless"
          timeout_seconds: 7200

        # Generate convenience store isochrones (Valhalla)
        - task_key: "create_isochrones_convenience"
          depends_on:
            - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              input_source: "convenience"
              valhalla_url: "https://valhalla1.openstreetmap.de"

          environment_key: "Serverless"
          timeout_seconds: 7200

        # Generate whitespace (expansion candidate) locations
        - task_key: "create_whitespace_locations"
          depends_on:
            - task_key: "clean_h3_features"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_whitespace_locations.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              state_filter: "${var.state_filter}"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Generate candidate location isochrones (Valhalla)
        - task_key: "create_isochrones_candidate"
          depends_on:
            - task_key: "create_whitespace_locations"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              input_source: "candidate"
              valhalla_url: "https://valhalla1.openstreetmap.de"

          environment_key: "Serverless"
          timeout_seconds: 7200

      max_concurrent_runs: 1
