resources:
  jobs:
    silver_poi_processing:
      name: "Silver - Feature Engineering"

      # PREREQUISITES - Required tables in bronze schema:
      # - lce_locations_mass (Little Caesars stores - manually uploaded)
      # - census_states (state boundaries)
      # - raw_pois (from poi_ingestion)
      #
      # External data sources:
      # - CARTO marketplace: carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications
      email_notifications:
        on_failure:
          - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "${bundle.target}"
        Layer: "silver"
        Pipeline: "feature_engineering"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"
              - "h3"
              - "shapely"
              - "requests"
              - "folium"

      tasks:
        # Clean POIs and split into convenience/competitors
        - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/clean_pois.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              state_filter: "${var.state_filter}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Generate LCE store isochrones (Valhalla)
        - task_key: "create_isochrones_lce"
          depends_on:
            - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              lce_locations_table: "${var.lce_locations_table}"
              input_source: "lce"
              valhalla_url: "https://valhalla1.openstreetmap.de"

          environment_key: "Serverless"
          timeout_seconds: 7200

        # Generate convenience store isochrones (Valhalla)
        - task_key: "create_isochrones_convenience"
          depends_on:
            - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              input_source: "convenience"
              valhalla_url: "https://valhalla1.openstreetmap.de"

          environment_key: "Serverless"
          timeout_seconds: 7200

        # Aggregate features for existing LCE stores
        - task_key: "aggregate_existing_lce_features"
          depends_on:
            - task_key: "create_isochrones_lce"
          notebook_task:
            notebook_path: ../transformations/02_silver/aggregate_existing_lce_features.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              carto_table: "${var.carto_table}"
              config_path: "${workspace.file_path}/resources/configs/h3_features_config.yml"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Generate expansion candidates with variable K-rings
        - task_key: "candidate_features_h3"
          depends_on:
            - task_key: "aggregate_existing_lce_features"
          notebook_task:
            notebook_path: ../transformations/02_silver/candidate_features_h3.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              carto_table: "${var.carto_table}"
              config_path: "${workspace.file_path}/resources/configs/h3_features_config.yml"

          environment_key: "Serverless"
          timeout_seconds: 7200

      max_concurrent_runs: 1
