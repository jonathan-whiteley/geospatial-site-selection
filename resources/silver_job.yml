resources:
  jobs:
    silver_poi_processing:
      name: "Silver - POI Cleaning, H3 Features & Isochrones"

      # PREREQUISITES - Required tables in bronze schema:
      # These tables must exist before running this job:
      # - competitor_locations (manually uploaded or created separately)
      # - rmc_retail_locations_grocery (manually uploaded or created separately)
      #
      # Tables created by bronze_census_ingestion job:
      # - census_demographics
      # - census_blockgroups
      # - census_states
      # - osm_pois_raw
      # - osm_downloads

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications
      email_notifications:
        on_failure:
          - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "${bundle.target}"
        Layer: "silver"
        Pipeline: "poi_processing_isochrones"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            dependencies:
              - "pyyaml"
              - "h3"
              - "shapely"
              - "requests"

      tasks:
        - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/clean_pois.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              state_filter: "${var.state_filter}"
              config_path: "${workspace.file_path}/resources/configs/poi_config.yml"

          environment_key: "Serverless"

          timeout_seconds: 3600
          max_retries: 2

        - task_key: "create_h3_features"
          depends_on:
            - task_key: "clean_pois"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_h3_features.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              state_fips: "${var.state_fips}"
              config_path: "${workspace.file_path}/resources/configs/h3_features_config.yml"

          environment_key: "Serverless"

          timeout_seconds: 7200
          max_retries: 2

        - task_key: "create_osrm_isochrones"
          depends_on:
            - task_key: "create_h3_features"
          notebook_task:
            notebook_path: ../transformations/02_silver/create_osrm_isochrones.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              input_table: "rmc_retail_locations_grocery"
              output_table: "rmc_urbanicity_based_isochrones"

          environment_key: "Serverless"

          timeout_seconds: 7200
          max_retries: 2

      max_concurrent_runs: 1
