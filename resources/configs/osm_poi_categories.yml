# OSM POI Category Mappings
# Maps OpenStreetMap tags to CARTO-compatible POI categories for H3 feature engineering.
# Used by: ingest_pois.ipynb (general POI classification from PBF extracts)
#
# Each category lists the primary OSM key and the tag values that map to it.
# A POI is classified by the FIRST matching category (priority order below).

poi_categories:

  food_drink:
    amenity:
      - restaurant
      - cafe
      - fast_food
      - bar
      - pub
      - food_court
      - ice_cream
      - biergarten

  retail:
