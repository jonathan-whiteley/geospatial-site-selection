# H3 Feature Engineering Configuration
# Configuration for H3-based features using CARTO marketplace data
# Version: 2.0
# Last Updated: 2025-12-18

# CARTO Marketplace Integration
carto_source:
  table: "carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3"
  h3_column: "h3"
  state_filter: "MA"  # Filter to Massachusetts only
  output_table: "h3_features_carto"

# H3 Grid Configuration
h3_grid:
  resolution: 8  # H3 resolution (8 = ~0.737 km² per cell)
  grid_sampling:
    lat_step: 0.01  # Degrees (~1 km)
    lon_step: 0.01  # Degrees (~1 km)

# CARTO Demographic Variables (from marketplace table)
# Note: Using CARTO columns instead of custom census aggregation
carto_demographic_variables:
  # Population variables (from CARTO)
  population:
    - population         # Total population
    - male              # Total male
    - female            # Total female
    - female_under_1
    - female_1_to_4
    - female_5_to_9
    - female_10_to_14
    - female_15_to_19
    - female_18_to_24   # Key demographic
    - female_20_to_24
    - female_25_to_29   # Young adults
    - female_30_to_34
    - female_35_to_39
    - female_40_to_44
    - female_45_to_49
    - female_45_to_54   # Mid-age
    - female_50_to_54
    - female_55_to_59
    - female_60_to_64
    - female_65_to_74   # Seniors
    - female_70_to_74
    - male_under_1
    - male_1_to_4
    - male_5_to_9
    - male_10_to_14
    - male_15_to_19
    - male_18_to_24     # Key demographic
    - male_20_to_24
    - male_25_to_29     # Young adults
    - male_30_to_34
    - male_35_to_39
    - male_40_to_44
    - male_45_to_49
    - male_45_to_54     # Mid-age
    - male_50_to_54
    - male_55_to_59
    - male_60_to_64
    - male_65_to_74     # Seniors
    - male_70_to_74

  # Income variables (from CARTO - note different binning)
  income:
    - income_less_than_10000
    - income_10000_to_14999
    - income_15000_to_24999
    - income_25000_to_34999
    - income_35000_to_49999
    - income_50000_to_74999
    - income_75000_to_99999      # High income threshold
    - income_100000_to_124999    # High income
    - income_125000_to_149999    # High income
    - income_150000_to_199999    # High income
    - income_200000_or_more      # High income

  # Household variables (from CARTO)
  households:
    - total_households
    - median_household_income

  # Education variables (from CARTO - check availability)
  education:
    - edu_less_than_high_school
    - edu_high_school
    - edu_some_college_associate
    - edu_bachelors
    - edu_graduate_professional

  # Employment variables (from CARTO - check availability)
  employment:
    - employed
    - unemployed
    - not_in_labor_force

  # Housing variables (from CARTO)
  housing:
    - total_housing_units
    - occupied_housing_units
    - vacant_housing_units
    - median_home_value
    - median_rent

  # Commute variables (from CARTO - check availability)
  commute:
    - commute_less_than_10_min
    - commute_10_to_19_min
    - commute_20_to_29_min
    - commute_30_to_44_min
    - commute_45_to_59_min
    - commute_60_plus_min

# Urbanicity Score Configuration
urbanicity:
  weights:
    population_density: 0.6  # Weight for population density (60%)
    poi_count: 0.4           # Weight for POI count (40%)

  normalization:
    method: "min_max"  # Min-max normalization to 0-1 scale

# Distance Calculation Configuration
# NOTE: Competitor distance calculations removed per project requirements
distance:
  units: "kilometers"  # Output distance units
  null_value: 999999   # Fill value for cells with no nearby locations
  
  # Calculate distance to nearest Little Caesars store
  lce_stores:
    enabled: true
    table: "jdub_demo_aws.geo_bronze.lce_locations_mass"

# Performance Configuration
performance:
  cache_intermediate_results: true
  broadcast_threshold_mb: 100  # Tables smaller than this will be broadcast

  # DataFrames to cache
  cache:
    - h3_base_df
    - h3_centers_df
    - competitors_df

# Output Configuration
output:
  table_name: "h3_features"
  write_mode: "overwrite"
  optimize_write: true
  auto_compact: true
  include_timestamp: true
