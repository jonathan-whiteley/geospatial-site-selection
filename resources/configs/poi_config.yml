# POI Configuration
# Single source of truth for brand definitions and POI cleaning settings
# Used by: ingest_pois.ipynb (Overpass query) and clean_pois.ipynb (filtering)

# ============================================================================
# Brand Definitions
# ============================================================================
brands:
  # Partner brands - stores where co-location is desirable
  # Overpass API uses regex substring matching on these names
  # clean_pois uses exact name matching (lowercased) to avoid false positives
  partner_brands:
    - "Walmart"
    - "Walmart Supercenter"
    - "Speedway"
    - "7-Eleven"
    - "Shaw's"
    - "Shaws"

  # Competitor brands - pizza competitors for exclusion analysis
  competitor_brands:
    - "Pizza Hut"
    - "Domino's"
    - "Dominos's Pizza"
    - "Papa John's"
    - "Papa Johns"

  # Display name mapping for partner brands (used in frontend/viz)
  # Maps lowercase name substrings → display labels
  partner_display_names:
    walmart: "Walmart"
    speedway: "7-Eleven/Speedway"
    7-eleven: "7-Eleven/Speedway"
    shaw: "Shaw's"

# ============================================================================
# POI Cleaning Settings (used by clean_pois.ipynb)
# ============================================================================
poi_cleaning:
  # POI ID prefix
  poi_id_prefix: "poi_"

  # Category extraction priority order
  category_priority:
    - shop
    - amenity

  # Address field names (OSM standard)
  address_fields:
    - addr:housenumber
    - addr:street
    - addr:city
    - addr:state
    - addr:postcode

  # State filtering tag names
  state_filter_tags:
    - addr:state
    - is_in:state

  # Coordinate validation bounds (standard lat/lon bounds)
  coordinate_bounds:
    latitude_min: -90
    latitude_max: 90
    longitude_min: -180
    longitude_max: 180
