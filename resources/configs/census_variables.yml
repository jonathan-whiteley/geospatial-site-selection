# Census ACS 5-Year Variables Configuration
# Keep total count under 49 (Census API limit: 50 including NAME)
# Current count: 42 variables

acs_5_year_variables:
  # Population (1 variable)
  population:
    B01003_001E: total_population

  # Target Demographic (ages 20-34, split into individual Census bins)
  # Combined into male/female_20_to_24, _25_to_29, _30_to_34 during H3 feature engineering
  target_demographic:
    B01001_008E: male_20
    B01001_009E: male_21
    B01001_010E: male_22_to_24
    B01001_011E: male_25_to_29
    B01001_012E: male_30_to_34
    B01001_032E: female_20
    B01001_033E: female_21
    B01001_034E: female_22_to_24
    B01001_035E: female_25_to_29
    B01001_036E: female_30_to_34

  # Income (18 variables)
  income:
    B19013_001E: median_household_income
    B19301_001E: per_capita_income
    B19001_002E: income_less_10k
    B19001_003E: income_10k_15k
    B19001_004E: income_15k_20k
    B19001_005E: income_20k_25k
    B19001_006E: income_25k_30k
    B19001_007E: income_30k_35k
    B19001_008E: income_35k_40k
    B19001_009E: income_40k_45k
    B19001_010E: income_45k_50k
    B19001_011E: income_50k_60k
    B19001_012E: income_60k_75k
    B19001_013E: income_75k_100k
    B19001_014E: income_100k_125k
    B19001_015E: income_125k_150k
    B19001_016E: income_150k_200k
    B19001_017E: income_200k_plus

  # Households (1 variable)
  households:
    B11001_001E: total_households

  # Education (5 variables)
  education:
    B15003_017E: high_school_grad
    B15003_022E: bachelors_degree
    B15003_023E: masters_degree
    B15003_024E: professional_degree
    B15003_025E: doctorate_degree

  # Employment (4 variables)
  employment:
    B23025_002E: in_labor_force
    B23025_005E: employed
    B23025_007E: not_in_labor_force
    B23025_004E: unemployment_count

  # Housing (3 variables)
  housing:
    B25077_001E: median_home_value
    B25002_003E: vacant_housing_units
    B25064_001E: median_gross_rent
