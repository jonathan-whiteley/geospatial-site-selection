resources:
  jobs:
    gold_feature_engineering:
      name: "Gold - Trade Area Aggregations"

      # PREREQUISITES - Required tables from silver schema:
      # These tables must be created by silver_poi_processing job first:
      # - h3_features_gold (created by silver job)
      # - rmc_urbanicity_based_isochrones (created by silver job)
      # - osm_pois (created by silver job)
      #
      # Run order: bronze_census_ingestion → silver_poi_processing → gold_feature_engineering

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications
      email_notifications:
        on_failure:
          - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "${bundle.target}"
        Layer: "gold"
        Pipeline: "feature_engineering"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            dependencies:
              - "pyyaml"

      tasks:

        - task_key: "aggregate_trade_area_features"
          notebook_task:
            notebook_path: ../transformations/03_gold/aggregate_trade_area_features.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              config_path: "${workspace.file_path}/resources/configs/h3_features_config.yml"
              trade_area_table: "${var.catalog}.${var.silver_schema}.rmc_urbanicity_based_isochrones"
              output_table_override: "rmc_urbanicity_based_isochrones_enriched"

          environment_key: "Serverless"

          timeout_seconds: 3600
          max_retries: 2

        # NOTE: Requires seed_points_expansion table in bronze and corresponding isochrones in silver
        # - task_key: "aggregate_seed_points_trade_area_features"
        #   depends_on:
        #     - task_key: "create_h3_features"
        #   notebook_task:
        #     notebook_path: ../transformations/03_gold/aggregate_trade_area_features.ipynb
        #     base_parameters:
        #       catalog: "${var.catalog}"
        #       silver_schema: "${var.silver_schema}"
        #       gold_schema: "${var.gold_schema}"
        #       config_path: "${workspace.file_path}/resources/configs/h3_features_config.yml"
        #       trade_area_table: "${var.catalog}.${var.silver_schema}.seed_points_expansion_isochrones"
        #       output_table_override: "seed_points_expansion_isochrones_enriched"
        #
        #   environment_key: "Serverless"
        #
        #   timeout_seconds: 3600
        #   max_retries: 2

        - task_key: "predict_seed_point_sales"
          notebook_task:
            notebook_path: ../transformations/03_gold/predict_seed_point_sales.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              gold_schema: "${var.gold_schema}"

          environment_key: "Serverless"

          timeout_seconds: 3600
          max_retries: 2

      max_concurrent_runs: 1
