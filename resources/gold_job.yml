resources:
  jobs:
    gold_feature_engineering:
      name: "Gold - Predictions & Visualization"

      # PREREQUISITES - Required tables from silver schema:
      # - expansion_candidates_h3 (from candidate_features_h3.ipynb)
      # - isochrones_lce (from create_isochrones.ipynb - Valhalla)
      # - existing_stores_h3 (from aggregate_existing_lce_features.ipynb)
      # - pois_competitors (from clean_pois.ipynb)
      # - isochrones_convenience (from create_isochrones.ipynb - Valhalla)
      #
      # Run order: bronze → silver → gold

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications (uncomment and set user_email variable to enable)
      # email_notifications:
      #   on_failure:
      #     - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "dev"
        Layer: "gold"
        Pipeline: "predictions_visualization"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"
              - "keplergl"

      tasks:
        # Expansion prediction with business constraints
        - task_key: "expansion_prediction"
          notebook_task:
            notebook_path: ../transformations/03_gold/expansion_prediction.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              min_predicted_sales: "250000"
              min_population: "5000"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Visualization layer preparation
        - task_key: "viz_layer_prep"
          depends_on:
            - task_key: "expansion_prediction"
          notebook_task:
            notebook_path: ../transformations/03_gold/viz_layer_prep.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"

          environment_key: "Serverless"
          timeout_seconds: 3600

      max_concurrent_runs: 1
