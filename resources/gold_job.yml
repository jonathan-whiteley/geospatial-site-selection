resources:
  jobs:
    gold_feature_engineering:
      name: "Gold - Predictions & Visualization"

      # PREREQUISITES - Required tables from silver schema:
      # - h3_features_clean (from clean_h3_features.ipynb - includes CARTO ingestion)
      # - isochrones_lce (from create_isochrones.ipynb - Valhalla)
      # - pois_competitors (from clean_pois.ipynb)
      # - isochrones_convenience (from create_isochrones.ipynb - Valhalla)
      #
      # Run order: bronze → silver → gold

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications (uncomment and set user_email variable to enable)
      # email_notifications:
      #   on_failure:
      #     - "${var.user_email}"

      # Job-level timeout (3 hours)
      timeout_seconds: 10800

      # Job-level tags
      tags:
        Environment: "dev"
        Layer: "gold"
        Pipeline: "predictions_visualization"

      # Serverless environment definition
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"
              - "keplergl"
              - "scikit-learn"
              - "xgboost"
              - "shap"
              - "seaborn"
              - "matplotlib"

      tasks:
        # Aggregate features for current stores (training data for ML model)
        - task_key: "agg_h3_features_current_stores"
          notebook_task:
            notebook_path: ../transformations/03_gold/agg_h3_features_current_stores.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # Aggregate features for expansion candidates (prediction input)
        - task_key: "agg_h3_features_candidates"
          depends_on:
            - task_key: "agg_h3_features_current_stores"
          notebook_task:
            notebook_path: ../transformations/03_gold/agg_h3_features_candidates.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"

          environment_key: "Serverless"
          timeout_seconds: 3600

        # ML model: train on current stores, predict on candidates, rank and finalize
        - task_key: "predict_candidate_sales"
          depends_on:
            - task_key: "agg_h3_features_candidates"
          notebook_task:
            notebook_path: ../transformations/03_gold/predict_candidate_sales.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"
              min_predicted_sales: "250000"
              min_population: "5000"

          environment_key: "Serverless"
          timeout_seconds: 5400

        # Visualization layer preparation
        - task_key: "viz_layer_prep"
          depends_on:
            - task_key: "predict_candidate_sales"
          notebook_task:
            notebook_path: ../transformations/03_gold/viz_layer_prep.ipynb
            base_parameters:
              catalog: "${var.catalog}"
              bronze_schema: "${var.bronze_schema}"
              silver_schema: "${var.silver_schema}"
              gold_schema: "${var.gold_schema}"

          environment_key: "Serverless"
          timeout_seconds: 3600

      max_concurrent_runs: 1
