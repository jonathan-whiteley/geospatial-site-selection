resources:
  jobs:
    site_selection_pipeline:
      name: "Site Selection - Full Pipeline"

      # PREREQUISITES - Manual Data Upload Required:
      # Before running this pipeline, ensure these tables exist in the bronze schema:
      # - lce_locations_mass (Little Caesars store locations with lat/lon)
      #
      # Pipeline execution order:
      # 1. Bronze ingestion (census + OSM data)
      # 2. Silver processing (POI cleaning, H3 features, isochrones)
      # 3. Gold aggregations (trade area features, predictions)

      # Queue configuration for serverless cost optimization
      queue:
        enabled: true

      # Email notifications
      email_notifications:
        on_failure:
          - "${var.user_email}"

      # Serverless environment
      environments:
        - environment_key: "Serverless"
          spec:
            environment_version: "4"
            dependencies:
              - "pyyaml"

      tasks:
        # Step 1: Bronze ingestion
        - task_key: "run_bronze_ingestion"
          run_job_task:
            job_id: ${resources.jobs.bronze_census_ingestion.id}

        # Step 2: Silver processing (POI cleaning, H3 features, isochrones)
        - task_key: "run_silver_processing"
          depends_on:
            - task_key: "run_bronze_ingestion"
          run_job_task:
            job_id: ${resources.jobs.silver_poi_processing.id}

        # Step 3: Gold aggregations
        - task_key: "run_gold_feature_engineering"
          depends_on:
            - task_key: "run_silver_processing"
          run_job_task:
            job_id: ${resources.jobs.gold_feature_engineering.id}

      max_concurrent_runs: 1

      tags:
        pipeline: "site_selection"
        layer: "orchestration"
