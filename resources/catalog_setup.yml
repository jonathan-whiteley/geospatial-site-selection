resources:
  # Medallion architecture: bronze, silver, gold schemas with volumes in bronze
  schemas:
    bronze_schema:
      name: "${var.bronze_schema}"
      catalog_name: "${var.catalog}"
      comment: "Bronze layer - raw ingested data from external sources"

    silver_schema:
      name: "${var.silver_schema}"
      catalog_name: "${var.catalog}"
      comment: "Silver layer - cleaned, validated, and deduplicated data"

    gold_schema:
      name: "${var.gold_schema}"
      catalog_name: "${var.catalog}"
      comment: "Gold layer - aggregated features and business-level aggregates"

  volumes:
    osm_data_volume:
      name: "osm_data"
      catalog_name: "${var.catalog}"
      schema_name: "${var.bronze_schema}"
      volume_type: "MANAGED"
      comment: "Raw OpenStreetMap PBF files for POI extraction"
