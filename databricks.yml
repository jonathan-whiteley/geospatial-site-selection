bundle:
  name: geospatial-site-selection

# PREREQUISITES - Manual Data Upload Required:
# Before running any jobs, ensure these tables exist in the bronze schema (geo_bronze):
# - competitor_locations (competitor store locations with lat/lon and store_type)
# - rmc_retail_locations_grocery (RMC retail store locations with lat/lon)
#
# Execution order: bronze_census_ingestion → silver_poi_processing → gold_feature_engineering
# See PIPELINE_DEPENDENCIES.md for detailed documentation

include:
  - resources/bronze_job.yml
  - resources/silver_job.yml
  - resources/gold_job.yml
  - resources/orchestration_job.yml
  - resources/catalog_setup.yml

# Sync configuration files to workspace
sync:
  include:
    - "resources/configs/*.yml"
    - "resources/configs/*.json"

targets:
  development:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: jdub_demo_aws
      bronze_schema: geo_bronze
      silver_schema: geo_silver
      gold_schema: geo_gold
      valhalla_cluster_id: "1216-204746-w1azw45u"
      mapbox_token: "pk.eyJ1IjoiandoaXRlbGV5NTI4MCIsImEiOiJjbWphbmVxem8wOGFuM2xweXBteHVqc2I2In0.d-Du72-AiqWe0j5n106UKw"

variables:
  # Unity Catalog
  catalog:
    description: "Unity Catalog name"
    default: "jdub_demo_aws"

  bronze_schema:
    description: "Bronze schema for raw ingested data"
    default: "geo_bronze"

  silver_schema:
    description: "Silver schema for cleaned and validated data"
    default: "geo_silver"

  gold_schema:
    description: "Gold schema for aggregated features and analytics"
    default: "geo_gold"

  # Census API Configuration
  census_api_key:
    description: "US Census Bureau API key"
    default: "7f801eabbdf7763d74330e776061901753eb2878"

  acs_year:
    description: "ACS 5-Year ending year"
    default: "2023"

  state_fips:
    description: "State FIPS code (25 = Massachusetts)"
    default: "25"

  # OSM Configuration
  osm_url:
    description: "Geofabrik OSM download URL"
    default: "https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf"

  osm_region:
    description: "OSM region name"
    default: "massachusetts"

  # Cluster Configuration
  node_type:
    description: "Databricks node type - m5d.xlarge has local storage, m5.xlarge needs EBS"
    default: "m5d.xlarge"

  valhalla_cluster_id:
    description: "Existing cluster ID for Valhalla tasks (e.g., Field Eng Shared UC LTS Cluster)"
    default: ""

  mapbox_token:
    description: "Mapbox API access token for isochrone generation (get free at https://account.mapbox.com/)"
    default: ""

  # GraphHopper Configuration
  graphhopper_volume:
    description: "Path to volume for GraphHopper graph storage"
    default: "/Volumes/jdub_demo_aws/geo_bronze/graphhopper_data/"

  # Isochrone Configuration
  drive_time_buckets:
    description: "Comma-separated list of drive time buckets in minutes"
    default: "5,10,15,20,30"

  time_limit_minutes:
    description: "Maximum search time limit in minutes"
    default: "40"

  tolerance_meters:
    description: "Geometry simplification tolerance in meters"
    default: "50"

  isochrone_input_table:
    description: "Full table name for isochrone input"
    default: "jdub_demo_aws.geo_bronze.rmc_retail_locations_grocery"

  isochrone_output_table_name:
    description: "Output table name"
    default: "rmc_urbanicity_based_isochrones"

  # POI Configuration
  state_filter:
    description: "State filter for POI extraction (e.g., MA for Massachusetts). Leave empty to process entire country."
    default: "MA"

  # Notifications
  user_email:
    description: "Email address for job notifications"
    default: "jonathan.whiteley@databricks.com"
