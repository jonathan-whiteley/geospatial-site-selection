bundle:
  name: geospatial-site-selection

# PREREQUISITES - Manual Data Upload Required:
# Before running any jobs, ensure these tables exist in the bronze schema (geo_bronze):
# - lce_locations_mass (Little Caesars store locations with lat/lon)
#
# Execution order: bronze_census_ingestion → silver_poi_processing → gold_feature_engineering
# See PIPELINE_DEPENDENCIES.md for detailed documentation

include:
  - resources/bronze_job.yml
  - resources/silver_job.yml
  - resources/gold_job.yml
  - resources/orchestration_job.yml
  - resources/catalog_setup.yml

# Sync configuration files to workspace
sync:
  include:
    - "resources/configs/*.yml"
    - "resources/configs/*.json"

targets:
  development:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: jdub_demo_aws
      bronze_schema: geo_bronze
      silver_schema: geo_silver
      gold_schema: geo_gold

variables:
  # Unity Catalog
  catalog:
    description: "Unity Catalog name"
    default: "jdub_demo_aws"

  bronze_schema:
    description: "Bronze schema for raw ingested data"
    default: "geo_bronze"

  silver_schema:
    description: "Silver schema for cleaned and validated data"
    default: "geo_silver"

  gold_schema:
    description: "Gold schema for aggregated features and analytics"
    default: "geo_gold"

  # Census API Configuration
  census_api_key:
    description: "US Census Bureau API key"
    default: "7f801eabbdf7763d74330e776061901753eb2878"

  acs_year:
    description: "ACS 5-Year ending year"
    default: "2023"

  state_fips:
    description: "State FIPS code (25 = Massachusetts)"
    default: "25"

  # OSM Configuration
  osm_url:
    description: "Geofabrik OSM download URL"
    default: "https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf"

  osm_region:
    description: "OSM region name"
    default: "massachusetts"

  # POI Configuration
  state_filter:
    description: "State filter for POI extraction (e.g., MA for Massachusetts). Leave empty to process entire country."
    default: "MA"

  # Manual Upload Tables
  lce_locations_table:
    description: "Little Caesars store locations table (must be manually uploaded)"
    default: "lce_locations_mass"

  # CARTO Marketplace Configuration
  carto_table:
    description: "CARTO Marketplace H3 features table"
    default: "carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3"

  # Notifications
  user_email:
    description: "Email address for job notifications"
    default: "jonathan.whiteley@databricks.com"
