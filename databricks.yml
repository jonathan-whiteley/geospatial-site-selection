bundle:
  name: geospatial-site-selection

# Bundle-level permissions - applies to all resources (jobs, schemas, etc.)
# (LCE-specific groups removed for VM deployment; add VM workspace groups here if needed)


include:
  - resources/bronze_job.yml
  - resources/silver_job.yml
  - resources/gold_job.yml
  - resources/orchestration_job.yml
  - resources/catalog_setup.yml

# Sync configuration files to workspace
sync:
  include:
    - "resources/configs/*.yml"

targets:
  # Production target - uses exact schema names without dev prefix
  production:
    mode: production
    default: true
    workspace:
      host: https://fe-vm-jdub-vm-serverless.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  # Development target - adds dev_{username}_ prefix to avoid conflicts
  development:
    mode: development
    workspace:
      host: https://fe-vm-jdub-vm-serverless.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # Uses variable defaults from bundle-level variables section

variables:

  # ============================================================================
  # ⚠️ REQUIRED - Update these for each new workspace deployment
  # ============================================================================

  # Unity Catalog & Schemas
  catalog:
    description: "Unity Catalog name"
    default: "jdub_demo"

  bronze_schema:
    description: "Bronze schema for raw ingested data"
    default: "geo_bronze"

  silver_schema:
    description: "Silver schema for cleaned and validated data"
    default: "geo_silver"

  gold_schema:
    description: "Gold schema for aggregated features and analytics"
    default: "geo_gold"

  # Data Sources
  lce_locations_raw_table:
    description: "Source table with current store locations and sales data (full 3-part name)"
    default: "jdub_demo.little_caesars.d_locations_raw_500"

  carto_table:
    description: "CARTO Marketplace H3 features table (full 3-part name, install from Marketplace first)"
    default: "carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3"

  # SQL Warehouse (required for Genie space creation)
  # Get ID from: SQL Warehouses → Select warehouse → Copy ID from URL or Connection Details
  # Must be a Pro or Serverless SQL warehouse (Standard does not support Genie)
  sql_warehouse_id:
    description: "SQL Pro or Serverless warehouse ID for Genie space creation"
    default: "0168e23e24e6ae10"

  # Census API
  # NOTE: For production, move to Databricks Secrets instead of plain text:
  #   databricks secrets create-scope census
  #   databricks secrets put-secret census api_key --string-value "<your-key>"
  #   Then reference in notebooks: dbutils.secrets.get("census", "api_key")
  census_api_key:
    description: "US Census Bureau API key (get from https://api.census.gov/data/key_signup.html)"
    default: "7f801eabbdf7763d74330e776061901753eb2878"

  # ============================================================================
  # ℹ️ OPTIONAL - Sensible defaults, update to change geographic scope
  # ============================================================================

  # Geographic Scope
  state_filter:
    description: "Comma-separated state abbreviations for H3 features / training data coverage"
    default: "MA,MI,VA,NY,WA,MD,NJ"

  expansion_state:
    description: "Target state for expansion candidate locations (whitespace analysis)"
    default: "MA"

  state_fips:
    description: "State FIPS code for Census block group downloads (25=MA, 36=NY, 26=MI, etc.)"
    default: "25"

  # Isochrone Routing
  valhalla_url:
    description: "Valhalla routing API URL for drive-time isochrone generation"
    default: "https://valhalla1.openstreetmap.de"

  # Notifications (uncomment email_notifications in job YMLs to enable)
  user_email:
    description: "Email address for job failure notifications"
    default: ""

  # ============================================================================
  # Pipeline Internals - Rarely need to change
  # ============================================================================

  acs_year:
    description: "ACS 5-Year survey ending year"
    default: "2023"
