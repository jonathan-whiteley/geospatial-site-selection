bundle:
  name: geospatial-site-selection

# ============================================================================
# DEPLOYMENT CONFIGURATION FOR NEW WORKSPACE
# ============================================================================
# When deploying to a NEW workspace, update these settings:
#
# REQUIRED UPDATES (marked with ⚠️):
# 1. WORKSPACE HOST (line 53):
#    - Update `workspace.host` to your Databricks workspace URL
#
# 2. CATALOG & SCHEMAS (lines 56-59):
#    - Update `catalog` to your Unity Catalog name
#    - Update `bronze_schema`, `silver_schema`, `gold_schema` to your schema names
#
# 3. USER EMAIL (line 122):
#    - Update `user_email` for job failure notifications
#
# 4. CENSUS API KEY (line 83):
#    - Get a free API key from: https://api.census.gov/data/key_signup.html
#    - Update `census_api_key` with your key
#
# OPTIONAL UPDATES (marked with ℹ️):
# - State/Region (lines 91-109): Update for different geographic area
# - CARTO Table (line 116): Update if using different CARTO data source
#
# DEPLOYMENT STEPS:
# 1. Update the REQUIRED settings above (marked with ⚠️)
# 2. Deploy the bundle to create Unity Catalog resources:
#    $ databricks bundle deploy
#    (Uses production target by default - creates resources with exact names)
#
#    For development with isolated schemas, use:
#    $ databricks bundle deploy -t development
#    (Adds dev_{username}_ prefix to avoid conflicts)
# 3. Verify the volume was created (IMPORTANT - troubleshooting step):
#    $ databricks volumes list {catalog}.{bronze_schema}
#    Expected output: osm_data volume should be listed
#    If not listed, the bronze_census_ingestion job will fail with volume errors
# 4. Manually upload the LCE store locations table to:
#    {catalog}.{bronze_schema}.lce_locations_mass
# 5. Run the pipeline jobs in order:
#    - bronze_census_ingestion → silver_poi_processing → gold_feature_engineering
#
# See PIPELINE_DEPENDENCIES.md for detailed documentation
# ============================================================================

include:
  - resources/bronze_job.yml
  - resources/silver_job.yml
  - resources/gold_job.yml
  - resources/orchestration_job.yml
  - resources/catalog_setup.yml

# Sync configuration files to workspace
sync:
  include:
    - "resources/configs/*.yml"
    - "resources/configs/*.json"

targets:
  # Production target - uses exact schema names without dev prefix
  production:
    mode: production
    default: true
    workspace:
      # ⚠️ UPDATE THIS: Replace with your Databricks workspace URL
      host: https://e2-demo-field-eng.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      # ⚠️ UPDATE THESE: Replace with your Unity Catalog and schema names
      catalog: jdub_demo_aws
      bronze_schema: geo_bronze
      silver_schema: geo_silver
      gold_schema: geo_gold

  # Development target - adds dev_{username}_ prefix to avoid conflicts
  development:
    mode: development
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: jdub_demo_aws
      bronze_schema: geo_bronze
      silver_schema: geo_silver
      gold_schema: geo_gold

variables:
  # Unity Catalog
  catalog:
    description: "Unity Catalog name"
    default: "jdub_demo_aws"

  bronze_schema:
    description: "Bronze schema for raw ingested data"
    default: "geo_bronze"

  silver_schema:
    description: "Silver schema for cleaned and validated data"
    default: "geo_silver"

  gold_schema:
    description: "Gold schema for aggregated features and analytics"
    default: "geo_gold"

  # Census API Configuration
  # ⚠️ UPDATE THIS: Get your free API key from https://api.census.gov/data/key_signup.html
  census_api_key:
    description: "US Census Bureau API key"
    default: "7f801eabbdf7763d74330e776061901753eb2878"

  acs_year:
    description: "ACS 5-Year ending year"
    default: "2023"

  # ℹ️ OPTIONAL: Update these if analyzing a different state/region
  state_fips:
    description: "State FIPS code (25 = Massachusetts, 06 = California, 36 = New York, etc.)"
    default: "25"

  # OSM Configuration
  # ℹ️ OPTIONAL: Update for different region from https://download.geofabrik.de/
  osm_url:
    description: "Geofabrik OSM download URL"
    default: "https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf"

  osm_region:
    description: "OSM region name"
    default: "massachusetts"

  # POI Configuration
  # ℹ️ OPTIONAL: Update to match your state (e.g., CA, NY, TX)
  state_filter:
    description: "State filter for POI extraction (e.g., MA for Massachusetts). Leave empty to process entire country."
    default: "MA"

  # Manual Upload Tables
  lce_locations_table:
    description: "Little Caesars store locations table (must be manually uploaded)"
    default: "lce_locations_mass"

  # CARTO Marketplace Configuration
  # ℹ️ OPTIONAL: Update if using different CARTO data source
  carto_table:
    description: "CARTO Marketplace H3 features table"
    default: "carto_spatial_features_usa_h3_res_8.carto.derived_spatialfeatures_usa_h3res8_v1_yearly_v3"

  # Notifications
  # ⚠️ UPDATE THIS: Replace with your email for job failure alerts
  user_email:
    description: "Email address for job notifications"
    default: "jonathan.whiteley@databricks.com"
